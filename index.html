<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<title>中医每日学习</title>
<style>
  :root{
    --bg:#F7F2E8; --card:#FFFDF7; --ink:#2C2A26; --sub:#6B6459;
    --accent:#9A3B2E; --green:#3F6B52; --line:#E6DDCB; --shadow:0 2px 10px rgba(120,100,70,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:17px; line-height:1.75;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:"Songti SC","Noto Serif SC",serif;font-weight:600;margin:0}
  button{font-family:inherit;font-size:17px;border:none;cursor:pointer}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;max-width:560px;margin:0 auto}
  .brand{font-family:"Songti SC",serif;font-size:18px;letter-spacing:.08em;color:var(--accent)}
  .streak{font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow)}
  .meta{font-size:13px;color:var(--sub);letter-spacing:.03em}
  .daynum{font-size:13px;color:var(--accent);letter-spacing:.12em;margin-bottom:6px}
  .title{font-size:30px;line-height:1.3;margin:2px 0 6px}
  .body p{margin:14px 0;font-size:17px}
  .quote{margin:10px 0 0;padding:12px 14px;background:#F4EDDD;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-family:"Songti SC",serif;font-size:16px;line-height:1.9;color:#443F36}
  .quote .from{display:block;margin-top:8px;font-family:inherit;font-size:12px;color:var(--sub);letter-spacing:.02em}
  .btn{display:block;width:100%;min-height:56px;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;letter-spacing:.04em;margin-top:18px;padding:14px 16px}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{min-height:46px;font-size:16px;margin-top:10px}
  .srcbtn{background:none;color:var(--sub);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
  .disclaimer{text-align:center;font-size:12px;color:#9A9384;margin:18px 0 0;letter-spacing:.04em}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,247,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .tab{flex:1;background:none;padding:14px 0 12px;font-size:14px;color:var(--sub);text-align:center}
  .tab.on{color:var(--accent);font-weight:600}
  .tab .dot{display:block;width:4px;height:4px;border-radius:99px;background:var(--accent);margin:6px auto 0;opacity:0}
  .tab.on .dot{opacity:1}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 0 14px}
  .tag{background:#EFE7D6;color:#7A6A4F;border-radius:6px;padding:2px 8px;font-size:12px}
  .stem{font-size:19px;line-height:1.7;margin:0 0 18px;font-family:"Songti SC",serif}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin:10px 0;font-size:17px;line-height:1.6;color:var(--ink);position:relative}
  .opt .lab{display:inline-block;min-width:22px;color:var(--sub);font-size:15px;margin-right:8px}
  .opt.right{border-color:#5C8C6E;background:#EDF5EF}
  .opt.right .lab{color:#3F6B52}
  .opt.wrongpick{border-color:#C0736A;background:#FBEDEA}
  .opt.wrongpick .lab{color:#9A3B2E}
  .opt:disabled{opacity:1}
  .expbox{margin-top:16px;border-radius:14px;padding:14px 16px;background:#F4EDDD;font-size:16px;line-height:1.8}
  .expbox.err{background:#FBEDEA}
  .expbox .verdict{font-weight:600;font-family:"Songti SC",serif;font-size:17px;margin-bottom:6px}
  .expbox.err .verdict{color:var(--accent)}
  .expbox.ok .verdict{color:var(--green)}
  .addwrong{font-size:13px;color:var(--accent);margin-top:8px}
  .big{font-size:26px;font-family:"Songti SC",serif;margin:6px 0 4px}
  .dots{display:flex;gap:8px;margin:16px 0}
  .rdot{width:14px;height:14px;border-radius:99px;background:#D8D0C0}
  .rdot.ok{background:#5C8C6E}
  .rdot.no{background:#C0736A}
  .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--sub);font-size:15px}
  .row .v{font-weight:600}
  .wq{padding:14px 0;border-bottom:1px solid var(--line)}
  .wq:last-child{border-bottom:none}
  .wq .qt{font-size:16px;line-height:1.65;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wq .qs{font-size:12px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:15px;line-height:2}
  .mask{position:fixed;inset:0;background:rgba(40,35,28,.5);display:none;align-items:flex-end;z-index:50}
  .mask.on{display:flex}
  .sheet{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .sheet h3{font-size:19px;margin-bottom:4px}
  .sheet .book{font-size:14px;color:var(--sub);margin-bottom:14px}
  .sheet .qtext{font-family:"Songti SC",serif;font-size:16px;line-height:1.9;background:#F4EDDD;padding:14px;border-radius:10px;margin:12px 0}
  .sheet a{color:var(--accent);font-size:14px;word-break:break-all}
  .closebtn{margin-top:20px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">中医每日学习</div>
  <div class="streak" id="streakTop">连续 0 天</div>
</div>

<div class="tabs" id="tabs">

  <button class="tab" data-tab="me">我的<span class="dot"></span></button>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

DAYS.forEach(function(d){
  d.quotes.forEach(function(q,i){ SRC["d"+d.n+"q"+i]=q; });

});

var QIDX={};
DAYS.forEach(function(d){ d.qs.forEach(function(q){ QIDX[q.id]=q; }); });

function defState(){ return {done:{},wrong:{},lastDate:null,streak:0,totalDone:0}; }
var S=(function(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&typeof o==="object"){
      var base=defState();
      ["done","wrong"].forEach(function(k){ if(!o[k]||typeof o[k]!=="object") o[k]=base[k]; });
      ["lastDate","streak","totalDone"].forEach(function(k){ if(o[k]===undefined) o[k]=base[k]; });
      return o;
    } }
  }catch(e){}
  return defState();
})();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function pad(n){ return n<10?"0"+n:""+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function shift(s,n){ var d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); }

function liveStreak(){
  if(!S.lastDate) return 0;
  var t=today();
  if(S.lastDate===t || S.lastDate===shift(t,-1)) return S.streak;
  return 0;
}
function learnedCount(){ return Object.keys(S.done).length; }
function wrongCount(){ return Object.keys(S.wrong).length; }

var app=document.getElementById("app");
var tabbar=document.getElementById("tabs");
var mask=document.getElementById("mask");
var sheet=document.getElementById("sheet");
var view={name:"today"};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function setTabs(on){
  Array.prototype.forEach.call(tabbar.querySelectorAll(".tab"),function(b){
    b.classList.toggle("on", b.getAttribute("data-tab")===on);
  });
  tabbar.style.display = (on==="quiz"||on==="result") ? "none" : "flex";
}

function renderTop(){
  var st=liveStreak();
  var txt = st>0 ? ("连续 "+st+" 天") : ((S.totalDone||0)>0 ? "已断签" : "还没开始");
  document.getElementById("streakTop").textContent = txt;
}

function render(){
  renderTop();
  if(view.name==="today") renderToday();
  else if(view.name==="quiz") renderQuiz();
  else if(view.name==="result") renderResult();
  else if(view.name==="wrong") renderWrong();
  else if(view.name==="me") renderMe();
}

function todayCard(d, doneToday){
  var q0=d.quotes[0];
  var quoteHtml='<div class="quote">'+esc(q0.text)+
    '<span class="from">'+esc(q0.book)+" · "+esc(q0.chapter)+'</span></div>';
  return '<div class="card">'+
    '<div class="daynum">第 '+d.n+' 天 · 约 '+d.mins+' 分钟</div>'+
    '<h1 class="title">'+esc(d.title)+'</h1>'+
    '<div class="meta">'+esc(d.sub)+'</div>'+
    '<div class="body">'+ d.body.map(function(p){ return "<p>"+esc(p)+"</p>"; }).join("") +'</div>'+
    quoteHtml+
    '<button class="srcbtn" data-src="d'+d.n+'q0">查看出处与原文 ›</button>'+
    (doneToday
      ? '<button class="btn ghost" id="reviewBtn">今天已完成 ✓　再练一遍</button>'
      : '<button class="btn" id="startBtn">看完了，开始做题（'+d.qs.length+' 题）</button>')+
    '<p class="disclaimer">学习参考，不是看病建议。</p>'+
  '</div>';
}

function renderToday(){
  var t=today();
  var doneDay=S.done[t];
  var allDone=learnedCount()>=DAYS.length;

  if(doneDay){
    var d=DAYS[doneDay-1];
    app.innerHTML = todayCard(d,true) +
      '<div class="card" style="margin-top:14px">'+
        '<div class="row"><span class="k">连续学习</span><span class="v">'+liveStreak()+' 天</span></div>'+
        '<div class="row"><span class="k">已学天数</span><span class="v">'+learnedCount()+' / 7</span></div>'+
        '<div class="row"><span class="k">明天</span><span class="v">'+(d.n<7?("第 "+(d.n+1)+" 天"):"7 天已学完")+'</span></div>'+
      '</div>'+
      '<p class="disclaimer">学习参考，不是看病建议。</div>';
    setTabs("today");
    document.getElementById("reviewBtn").addEventListener("click",function(){
      startQuiz(d,"review");
    });
    var sbDone=app.querySelector(".srcbtn");
    if(sbDone) sbDone.addEventListener("click",function(){ openSrc(sbDone.getAttribute("data-src")); });
    return;
  }

  var next = allDone ? DAYS[DAYS.length-1] : DAYS[Math.min(learnedCount(),DAYS.length-1)];
  var extra = allDone ? '<div class="card" style="margin-top:14px"><div class="meta">7 天内容已全部学完。下面这一课可以反复复习，错题本里的题也可以单独考。</div></div>' : "";
  app.innerHTML = (allDone?'<div class="daynum" style="margin:6px 0 8px">复习模式 · 7 天已学完</div>':"") +
    todayCard(next,false) + extra;
  setTabs("today");

  var btn=document.getElementById("startBtn");
  if(btn) btn.addEventListener("click",function(){ startQuiz(next,"daily"); });

  var sb=app.querySelector(".srcbtn");
  if(sb) sb.addEventListener("click",function(){ openSrc(sb.getAttribute("data-src")); });
}

var quiz=null;

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function startQuiz(d,mode){
  quiz={ day:d, mode:mode, list:d.qs, i:0, picked:null, res:[], wrongAdded:false };
  view.name="quiz"; render();
}

function startWrongQuiz(){
  var ids=Object.keys(S.wrong);
  if(!ids.length) return;
  var list=shuffle(ids).slice(0,5).map(function(id){ return QIDX[id]; });
  quiz={ day:null, mode:"wrong", list:list, i:0, picked:null, res:[], wrongAdded:false };
  view.name="quiz"; render();
}

function renderQuiz(){
  setTabs("quiz");
  var q=quiz.list[quiz.i];
  var isTf = q.type==="tf";
  var opts=q.opts.map(function(o,idx){
    var cls="opt";
    if(quiz.picked!==null){
      if(idx===q.ans) cls+=" right";
      else if(idx===quiz.picked) cls+=" wrongpick";
    }
    return '<button class="'+cls+'" data-idx="'+idx+'" '+(quiz.picked!==null?"disabled":"")+'>'+
      (isTf?"":'<span class="lab">'+"ABCD"[idx]+'</span>')+esc(o)+'</button>';
  }).join("");

  var answered=quiz.picked!==null;
  var ok=answered && quiz.picked===q.ans;
  var expHtml="";
  if(answered){
    expHtml='<div class="expbox '+(ok?"ok":"err")+'">'+
      '<div class="verdict">'+(ok?"答对了":"答错了，正确答案是 "+(isTf?"「"+q.opts[q.ans]+"」":("ABCD"[q.ans])))+'</div>'+
      '<div>'+esc(q.exp)+'</div>'+
      (ok
        ? (quiz.mode==="wrong" && quiz.removed ? '<div class="addwrong" style="color:#3F6B52">答对，已移出错题本</div>' : "")
        : '<div class="addwrong">已加入错题本</div>')+
      '<button class="srcbtn" data-src="'+q.id+'" style="margin-top:8px">查看出处 ›</button>'+
    '</div>';
  }

  var last = quiz.i===quiz.list.length-1;
  app.innerHTML='<div class="qhead"><span>第 '+(quiz.i+1)+' 题 / 共 '+quiz.list.length+' 题</span>'+
      '<span class="tag">'+(isTf?"判断题":"单选题")+'</span></div>'+
    '<p class="stem">'+esc(q.stem)+'</p>'+
    '<div id="opts">'+opts+'</div>'+
    expHtml+
    (answered?'<button class="btn" id="nextBtn">'+(last?"完成":"下一题")+'</button>':"")+
    '<p class="disclaimer">学习参考，不是看病建议。</p>';

  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
    b.addEventListener("click",function(){ pick(parseInt(b.getAttribute("data-idx"),10)); });
  });
  var sb=app.querySelector(".srcbtn");
  if(sb) sb.addEventListener("click",function(){ openSrc(sb.getAttribute("data-src")); });
  var nb=document.getElementById("nextBtn");
  if(nb) nb.addEventListener("click",next);
}

function pick(idx){
  if(quiz.picked!==null) return;
  var q=quiz.list[quiz.i];
  quiz.picked=idx;
  var ok = idx===q.ans;
  quiz.res.push({id:q.id,ok:ok});
  if(!ok){
    var w=S.wrong[q.id]||{count:0,last:null};
    w.count++; w.last=today(); w.stem=q.stem; w.day=quiz.day?quiz.day.n:0;
    S.wrong[q.id]=w;
    quiz.wrongAdded=true;
  } else if(quiz.mode==="wrong" && S.wrong[q.id]){
    delete S.wrong[q.id];
    quiz.removed=true;
  }
  save(); render();
}

function next(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; quiz.picked=null; quiz.wrongAdded=false; quiz.removed=false; renderQuiz(); }
  else finish();
}

function finish(){
  var right=quiz.res.filter(function(r){ return r.ok; }).length;
  var t=today();
  var isNew = false;
  var streakNow = liveStreak();

  if(quiz.mode==="daily" && !S.done[t]){
    S.done[t]=quiz.day.n;
    S.totalDone=(S.totalDone||0)+1;
    if(S.lastDate===shift(t,-1)) streakNow=S.streak+1;
    else streakNow=1;
    S.streak=streakNow;
    S.lastDate=t;
    isNew=true;
    save();
  } else if(quiz.mode==="review"){
    streakNow=S.streak;
  } else {
    streakNow=liveStreak();
  }

  view.name="result";
  view.summary={ right:right, total:quiz.list.length, mode:quiz.mode, streak:streakNow, isNew:isNew, res:quiz.res };
  render();
}

function renderResult(){
  setTabs("result");
  var s=view.summary;
  var dots=s.res.map(function(r){ return '<span class="rdot '+(r.ok?"ok":"no")+'"></span>'; }).join("");
  var title, sub;
  if(s.mode==="wrong"){
    title="错题考试结束"; sub="答对 "+s.right+" 题，答错的留在错题本里。";
  } else if(s.isNew){
    title="今天完成了 ✓"; sub="知识点看完、题也做完，这一天才算打卡。";
  } else {
    title="又练了一遍"; sub="今天已经打过卡，这次不计入天数。";
  }
  app.innerHTML='<div class="card">'+
    '<h2 class="big">'+title+'</h2>'+
    '<div class="meta">'+sub+'</div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="row"><span class="k">答对</span><span class="v">'+s.right+' / '+s.total+'</span></div>'+
    '<div class="row"><span class="k">连续学习</span><span class="v">'+s.streak+' 天</span></div>'+
    '<div class="row"><span class="k">错题本</span><span class="v">'+wrongCount()+' 道</span></div>'+
    '<button class="btn" id="goWrong">看看错题</button>'+
    '<button class="btn ghost" id="goHome">回首页</button>'+
    '<p class="disclaimer">学习参考，不是看病建议。</p>'+
  '</div>';
  document.getElementById("goHome").addEventListener("click",function(){ view.name="today"; render(); });
  document.getElementById("goWrong").addEventListener("click",function(){ view.name="wrong"; render(); });
}

function renderWrong(){
  setTabs("wrong");
  var ids=Object.keys(S.wrong);
  if(!ids.length){
    app.innerHTML='<div class="card"><h2 class="big" style="font-size:22px">错题本</h2>'+
      '<div class="empty">还没有错题。<br>答错的题会自动进这里，可以单独考试。</div>'+
      '<p class="disclaimer">学习参考，不是看病建议。</p></div>';
    return;
  }
  var rows=ids.map(function(id){
    var w=S.wrong[id], q=QIDX[id];
    if(!q) return "";
    return '<div class="wq">'+
      '<p class="qt">'+esc(q.stem)+'</p>'+
      '<div class="qs">第 '+(w.day||"?")+' 天 · 答错 '+w.count+' 次</div>'+
      '<button class="srcbtn" data-id="'+id+'">看答案与出处 ›</button>'+
    '</div>';
  }).join("");

  app.innerHTML='<div class="card">'+
    '<div class="meta">错题 '+ids.length+' 道</div>'+
    '<h2 class="big" style="font-size:22px">只考错过的题</h2>'+
    '<button class="btn" id="wrongExam">开始错题考试（最多 5 题）</button>'+
  '</div>'+
  '<div class="card" style="margin-top:14px">'+rows+'</div>'+
  '<p class="disclaimer">学习参考，不是看病建议。</p>';

  document.getElementById("wrongExam").addEventListener("click",startWrongQuiz);
  Array.prototype.forEach.call(app.querySelectorAll(".srcbtn"),function(b){
    b.addEventListener("click",function(){
      var id=b.getAttribute("data-id");
      var q=QIDX[id];
      openSheet(
        '<h3>'+esc(q.stem)+'</h3>'+
        '<div class="book">正确答案：'+esc(q.type==="tf"?q.opts[q.ans]:("ABCD"[q.ans]+"　"+q.opts[q.ans]))+'</div>'+
        '<div class="qtext">'+esc(q.exp)+'</div>'+
        srcHtml(q.src)
      );
    });
  });
}

function renderMe(){
  setTabs("me");
  app.innerHTML='<div class="card">'+
    '<div class="row"><span class="k">连续学习</span><span class="v">'+liveStreak()+' 天</span></div>'+
    '<div class="row"><span class="k">总打卡天数</span><span class="v">'+(S.totalDone||0)+' 天</span></div>'+
    '<div class="row"><span class="k">已学课程</span><span class="v">'+learnedCount()+' / 7</span></div>'+
    '<div class="row"><span class="k">错题</span><span class="v">'+wrongCount()+' 道</span></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px">'+
    '<div class="meta">规则</div>'+
    '<div class="body" style="font-size:16px">'+
      '<p>每天看完一个知识点、做完当天的题，才算打卡。</p>'+
      '<p>断一天，连续天数从零重新算。已学的课程不会因此回退。</p>'+
      '<p>答错的题自动进错题本。错题考试答对，就移出错题本。</p>'+
    '</div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px">'+
    '<div class="meta">数据存在哪里</div>'+
    '<div class="body" style="font-size:16px"><p>全部存在这台手机的浏览器里，刷新不丢。换手机、清理浏览器缓存会丢，这个版本没有登录，也没有云端备份。</p></div>'+
    '<button class="btn ghost small" id="resetBtn">清空全部数据，重新开始</button>'+
  '</div>'+
  '<p class="disclaimer">学习参考，不是看病建议。</p>';

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(confirm("确定清空全部学习记录？清空后不能恢复。")){
      S=defState(); save(); view.name="today"; render();
    }
  });
}

function openSheet(html){
  sheet.innerHTML=html+'<button class="btn ghost closebtn" id="closeSheet">关闭</button>';
  mask.classList.add("on");
  document.getElementById("closeSheet").addEventListener("click",function(){ mask.classList.remove("on"); });
}
function srcHtml(s){
  if(!s) return "";
  var t="";
  if(s.text) t='<div class="qtext">'+esc(s.text)+'</div>';
  return '<div class="book" style="margin-top:16px">出处：'+esc(s.book)+" · "+esc(s.chapter)+'</div>'+
    (s.type?'<div class="book">'+esc(s.type)+'</div>':"")+
    t+
    (s.url?'<div style="margin-top:12px"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">打开原文链接 ›</a></div>':"");
}
function openSrc(key){
  var s=SRC[key];
  if(!s) return;
  var body = (s.type?'<div class="book">'+esc(s.type)+'</div>':"")+
    (s.text?'<div class="qtext">'+esc(s.text)+'</div>':"")+
    (s.url?'<div style="margin-top:12px"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">打开原文链接 ›</a></div>':"");
  openSheet('<h3>'+esc(s.book)+" · "+esc(s.chapter)+'</h3>'+body);
}
mask.addEventListener("click",function(e){ if(e.target===mask) mask.classList.remove("on"); });

Array.prototype.forEach.call(tabbar.querySelectorAll(".tab"),function(b){
  b.addEventListener("click",function(){
    var t=b.getAttribute("data-tab");
    quiz=null;
    view.name = (t==="today")?"today":(t==="wrong"?"wrong":"me");
    render();
  });
});

render();

})();
</script>
</body>
</html>
